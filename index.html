<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CatchMail Inbox Viewer</title>
  <style>
    body{font-family:Arial;padding:15px}
    input{width:100%;padding:8px;margin:8px 0}
    button{padding:8px 12px}
    li{margin:6px 0}
    pre{white-space:pre-wrap;background:#f5f5f5;padding:10px}
  </style>
</head>
<body>

<h2>📩 CatchMail Inbox Viewer</h2>

<input id="email" placeholder="nhập email, ví dụ abc@domain.com">
<button onclick="loadInbox()">Load Inbox</button>

<ul id="list"></ul>

<h3>Nội dung mail</h3>
<pre id="content"></pre>

<script>
const API = "https://catchmail-inbox.vercel.app/api"; // LINK VERCEL CỦA BẠN

async function loadInbox() {
  const email = document.getElementById("email").value.trim();
  if (!email) return alert("Nhập email trước");

  const r = await fetch(`${API}/inbox?address=${email}`);
  const data = await r.json();

  const list = document.getElementById("list");
  list.innerHTML = "";

  if (!data || data.length === 0) {
    list.innerHTML = "<li>Chưa có mail</li>";
    return;
  }

  data.forEach(m => {
    const li = document.createElement("li");
    li.innerHTML = `<a href="#" onclick="loadMsg('${m.id}','${email}')">
      ${m.subject || "(no subject)"}
    </a>`;
    list.appendChild(li);
  });
}

async function loadMsg(id, mailbox) {
  const r = await fetch(`${API}/message?id=${id}&mailbox=${mailbox}`);
  const data = await r.json();
  document.getElementById("content").textContent =
    data.text || data.html || JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
